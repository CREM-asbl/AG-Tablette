name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (Chromium)
        run: pnpm run test:playwright:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  deploy-production:
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests, build, e2e ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Firebase token
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Missing FIREBASE_TOKEN secret. Deployment blocked."
            exit 1
          fi

      - name: Bump patch version
        run: |
          node scripts/bump-version.mjs
          echo "BUMPED_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json android/twa/twa-manifest.json
          git commit -m "chore(release): bump version to ${BUMPED_VERSION} [skip ci]" || echo "Nothing to commit"
          git tag "v${BUMPED_VERSION}"
          git push origin HEAD:master "v${BUMPED_VERSION}"

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: pnpm dlx firebase-tools deploy --only hosting --project apprenti-geometre --token "$FIREBASE_TOKEN"

    deploy-manual:
      runs-on: ubuntu-latest
      needs: [ lint, unit-tests, build, e2e ]
      if: github.event_name == 'workflow_dispatch'
      permissions:
        contents: write
      inputs:
        version_type:
          description: 'Version bump type'
          required: true
          default: 'patch'
          type: choice
          options:
            - patch
            - minor
            - major

      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Setup pnpm
          uses: pnpm/action-setup@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: ${{ env.NODE_VERSION }}
            cache: 'pnpm'

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        - name: Verify Firebase token
          env:
            FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          run: |
            if [ -z "$FIREBASE_TOKEN" ]; then
              echo "::error::Missing FIREBASE_TOKEN secret. Deployment blocked."
              exit 1
            fi

        - name: Bump version (${{ github.event.inputs.version_type }})
          run: |
            node scripts/bump-version.mjs --type=${{ github.event.inputs.version_type }}
            echo "BUMPED_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

        - name: Commit version bump
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json android/twa/twa-manifest.json
            git commit -m "chore(release): bump ${{ github.event.inputs.version_type }} version to ${BUMPED_VERSION} [skip ci]" || echo "Nothing to commit"
            git tag "v${BUMPED_VERSION}"
            git push origin HEAD:master "v${BUMPED_VERSION}"

        - name: Deploy to Firebase Hosting
          env:
            FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          run: pnpm dlx firebase-tools deploy --only hosting --project apprenti-geometre --token "$FIREBASE_TOKEN"
