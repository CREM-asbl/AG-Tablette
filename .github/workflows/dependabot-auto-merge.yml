# Auto-merge pull requests opened by Dependabot once CI is green.
name: Dependabot auto-merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Approve and auto-merge Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Wait for CI checks to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          for i in $(seq 1 120); do
            json="$(gh pr checks "$PR" --repo "$REPO" --json name,state,bucket,workflow)"
            ci_checks="$(echo "$json" | jq '[.[] | select((.workflow | test("auto-merge|dependabot"; "i")) | not)]')"
            failed="$(echo "$ci_checks" | jq '[.[] | select(.bucket == "fail")] | length')"
            pending="$(echo "$ci_checks" | jq '[.[] | select(.state == "PENDING" or .state == "IN_PROGRESS" or .state == "QUEUED" or .state == "STARTING")] | length')"
            if [ "$failed" -gt 0 ]; then
              echo "CI checks failed"
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "CI checks complete"
              break
            fi
            sleep 10
          done
      - name: Approve Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --approve

      - name: Merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash
