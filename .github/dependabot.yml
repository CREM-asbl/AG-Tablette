# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # npm dependencies (root package.json only; node_modules/ and .kilo/ worktrees are not scanned)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      all-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Gradle dependencies for the Trusted Web Activity (Android)
  - package-ecosystem: "gradle"
    directory: "/android/twa"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      all-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/android/twa/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      all-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
